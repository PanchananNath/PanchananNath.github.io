# ─────────────────────────────────────────────────────────────
#  MENTORING — programmes → groups → members
#
#  display: how a programme is animated on the page
#    carousel  — swipeable slider with arrows, dots and gentle autoplay
#    flip      — cards that flip over to reveal the team
#    marquee   — two rows of cards gliding past (pause on hover)
#    deck      — a stack of cards you deal through one at a time
#    spotlight — one large feature card (good for a single group)
#
#  Members can be plain text:      - "Jane Doe (B.Tech 24–28)"
#  …or carry a photo:              - { name: "Jane Doe", note: "B.Tech 24–28", photo: "/assets/img/mentoring/jane.jpg" }
#  A group can also have a team photo:   photo: "/assets/img/mentoring/team.jpg"
#  Missing photos fall back to initials automatically.
# ─────────────────────────────────────────────────────────────

