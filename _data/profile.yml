bio: >-
  I work where compilers, networks and security meet. My doctoral research at
  IIIT Guwahati covers intermittent computing, compiler-based security and code
  analysis, early-exit deep learning and multi-access edge computing. Alongside
  research I have spent years in industry and outreach: founding
  EncryptoCyberspace, working with EC-Council's R&D team, and volunteering as a
  Cyber Crime Intervention Officer with ISAC India.

philosophy:
  quote: "Security is neither a product, nor a process but the philosophy."
  note: "Higher the security, lower the usability. Lower the security, higher the usability."

