# -------------------------------------------------------------
#  INVITED TALKS - one entry per organisation, newest first.
#  An organisation can have several talks; each becomes a row.
#
#  org / place / url     the host, shown with its logo on the left
#  logo:                 image in assets/img/talks/ (missing -> initials)
#  talks:
#    title:    name of the talk (leave out if you don't have it)
#    type:     Invited talk | Keynote | Expert lecture | Hands-on session | Panel ...
#    mode:     In person | Online | Hybrid
#    date:     "Mar 2024", "2022-23", 2023 ...
#    audience: "70+ participants", "B.Tech students" ...
#    link:     slides, certificate, news item (optional)
# -------------------------------------------------------------

