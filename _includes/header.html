{% assign p = site.data.profile %}
<header class="site-head">
  <div class="wrap site-head__row">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ p.name }}, home">
      <svg class="brand__chip" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="7" y="7" width="18" height="18" rx="3"/>
        <path d="M11 7V3M16 7V3M21 7V3M11 25v4M16 25v4M21 25v4M7 11H3M7 16H3M7 21H3M25 11h4M25 16h4M25 21h4"/>
      </svg>
      <span class="brand__name">{{ p.name }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.nav %}
          {% assign item_url = item.url | relative_url %}
          <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      <button class="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>
