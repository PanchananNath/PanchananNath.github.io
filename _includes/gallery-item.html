{% assign gm_src = include.src | relative_url %}
{% if include.kind == "reel" %}
<li class="reel__slide" data-src="{{ gm_src }}" data-caption="{{ include.caption | escape }}">
  <button type="button" class="reel__thumb" aria-label="Show photo{% if include.caption %}: {{ include.caption | escape }}{% endif %}"><img src="{{ gm_src }}" alt="" loading="lazy" decoding="async"></button>
</li>
{% else %}
<li class="gal__item" data-section="{{ include.section }}">
  <button type="button" class="gal__btn" data-zoom data-caption="{{ include.caption | escape }}" aria-label="Enlarge photo{% if include.caption %}: {{ include.caption | escape }}{% endif %}">
    <img src="{{ gm_src }}" alt="{{ include.caption | escape }}" loading="lazy" decoding="async">
  </button>
  {% if include.caption and include.caption != "" %}<p class="gal__cap">{{ include.caption }}</p>{% endif %}
</li>
{% endif %}
