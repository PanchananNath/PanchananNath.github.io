{% assign person = include.person %}
<li class="person{% if include.size == 'lg' %} person--lg{% endif %}">
  {% include avatar.html name=person.name photo=person.photo size=include.size %}
  <div>
    <p class="person__name">{% if person.url %}<a href="{{ person.url }}" rel="noopener" target="_blank">{{ person.name }}</a>{% else %}{{ person.name }}{% endif %}</p>
    {% if person.relation %}<p class="person__rel">{{ person.relation }}</p>{% endif %}
    <p class="person__role">{{ person.role }}</p>
  </div>
</li>
